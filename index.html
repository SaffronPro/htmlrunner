<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Code Runner with Fullscreen Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Header Bar */
        .header {
            background-color: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3c3c3c;
            height: 50px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            color: #4fc08d;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #4fc08d;
            color: #1e1e1e;
            border: none;
            padding: 6px 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3aa876;
        }

        button.btn-secondary {
            background-color: #444;
            color: #fff;
        }

        button.btn-secondary:hover {
            background-color: #555;
        }

        /* Workspace Grid Split */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            width: 100%;
        }

        .panel {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .editor-panel {
            border-right: 1px solid #3c3c3c;
        }

        .panel-title {
            background-color: #252526;
            padding: 6px 12px;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #3c3c3c;
        }

        textarea {
            width: 100%;
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        /* Preview Area & Native Fullscreen Hook */
        .preview-container {
            flex: 1;
            background-color: #ffffff;
            position: relative;
            height: 100%;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        /* Inline Fullscreen fallback UI indicator (Esc key hint) */
        .fullscreen-overlay-btn {
            display: none;
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Style tweaks when the browser triggers HTML5 Fullscreen on the preview container */
        .preview-container:fullscreen .fullscreen-overlay-btn {
            display: block;
        }
        .preview-container:-webkit-full-screen .fullscreen-overlay-btn {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Control Header -->
        <header class="header">
            <div class="logo">HTML Runner</div>
            <div class="btn-group">
                <button onclick="runCode()">▶ Run Code</button>
                <button class="btn-secondary" onclick="toggleFullscreen()">🖵 Fullscreen Preview</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Left Side: Source Code Editor -->
            <section class="panel editor-panel">
                <div class="panel-title">Source Code (HTML/CSS/JS)</div>
                <textarea id="code-editor" spellcheck="false"><!-- Write your HTML here -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74abe2, #5563de);
            color: white;
            margin: 0;
        }
        h1 { margin-bottom: 5px; }
        p { opacity: 0.9; }
    </style>
</head>
<body>
    <h1>Hello World!</h1>
    <p>Your instant live execution workspace.</p>

    <script>
        console.log("Runner code successfully executed inside the iframe!");
    </script>
</body>
</html></textarea>
            </section>

            <!-- Right Side: Target Render Preview -->
            <section class="panel" id="preview-panel">
                <div class="panel-title">Live Preview</div>
                <div class="preview-container" id="fullscreen-target">
                    <div class="fullscreen-overlay-btn">Press ESC to exit fullscreen</div>
                    <iframe id="preview-frame"></iframe>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Inject data from text editor to the iframe sandbox
        function runCode() {
            const code = document.getElementById('code-editor').value;
            const iframe = document.getElementById('preview-frame');
            
            // Accessing the iframe standard document context
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            iframeDoc.open();
            iframeDoc.write(code);
            iframeDoc.close();
        }

        // Trigger JavaScript Fullscreen API specifically targetting the Preview container
        function toggleFullscreen() {
            const target = document.getElementById('fullscreen-target');

            if (!document.fullscreenElement) {
                if (target.requestFullscreen) {
                    target.requestFullscreen();
                } else if (target.webkitRequestFullscreen) { /* Safari support */
                    target.webkitRequestFullscreen();
                } else if (target.msRequestFullscreen) { /* IE11 support */
                    target.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Auto-run template boilerplate code immediately on initialization
        window.onload = function() {
            runCode();
        };
    </script>
</body>
</html>
