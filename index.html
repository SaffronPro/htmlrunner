<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #1e1e1e;
      color: #fff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #2d2d2d;
      border-bottom: 1px type solid #444;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 45px);
    }
    #code-input {
      width: 50%;
      height: 100%;
      background-color: #121212;
      color: #dcdcdc;
      border: none;
      border-right: 1px solid #444;
      padding: 15px;
      font-family: monospace;
      font-size: 0.95rem;
      resize: none;
      outline: none;
    }
    #preview-frame {
      width: 50%;
      height: 100%;
      background-color: #fff;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Simple HTML Runner</h1>
    <div class="controls">
      <button id="run-btn">Run Code</button>
      <button id="fullscreen-btn">Fullscreen Preview</button>
    </div>
  </header>

  <div class="container" id="app-container">
    <textarea id="code-input" placeholder="Type or paste your HTML code here..."><h1>Hello World!</h1>
<p>This is a live HTML preview.</p></textarea>
    <iframe id="preview-frame"></iframe>
  </div>

  <script>
    const codeInput = document.getElementById('code-input');
    const previewFrame = document.getElementById('preview-frame');
    const runBtn = document.getElementById('run-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const appContainer = document.getElementById('app-container');

    // Function to render the code inside the iframe
    function runCode() {
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(codeInput.value);
      doc.close();
    }

    // Run initial code on load
    runCode();

    // Run code on button click
    runBtn.addEventListener('click', runCode);

    // Fullscreen toggle logic
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        appContainer.requestFullscreen().catch(err => {
          alert(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Update button text depending on fullscreen state
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fullscreenBtn.textContent = 'Exit Fullscreen';
      } else {
        fullscreenBtn.textContent = 'Fullscreen Preview';
      }
    });
  </script>

</body>
</html>
