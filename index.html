<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HTML File Runner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .file-dropzone {
            border: 2px dashed #cbd5e1;
            padding: 30px 20px;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .file-dropzone:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
        .btn-text {
            font-weight: 600;
            color: #3b82f6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HTML Runner</h1>
    <p>Upload your HTML file to launch it instantly in a new tab.</p>
    
    <label class="file-dropzone" id="dropzone">
        <span class="upload-icon">📄</span>
        <span><span class="btn-text">Click to upload</span> or drag & drop</span>
        <input type="file" id="fileInput" accept=".html,.htm">
    </label>
</div>

<script>
    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        reader.onload = function(e) {
            const htmlContent = e.target.result;
            
            // Create a temporary Blob object representing the HTML content
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            
            // Open the Blob URL in a brand new browser tab
            window.open(blobUrl, '_blank');
            
            // Optional: Reset input so the user can upload the same file again if modified
            fileInput.value = '';
        };

        // Read the file structure as text string
        reader.readAsText(file);
    });
</script>

</body>
</html>
